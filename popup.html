<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      margin: 0;
    }

    h2 {
      margin: 0 0 16px 0;
      font-size: 18px;
      text-align: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .section {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f00;
    }

    .status-dot.active {
      background: #0f0;
      box-shadow: 0 0 8px #0f0;
    }

    .status-text {
      font-size: 13px;
    }

    .key {
      display: inline-block;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      padding: 2px 8px;
      font-family: monospace;
      font-size: 12px;
      margin: 2px;
    }

    .controls-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .toggle-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .toggle-btn.secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .toggle-btn.secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #666;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h2>🎬 抖音逐帧控制</h2>

  <div class="section">
    <div class="section-title">状态</div>
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">未检测到视频</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">键盘快捷键</div>
    <div class="controls-list">
      <div class="control-item">
        <span>后退一帧</span>
        <span><span class="key">D</span> 或 <span class="key">←</span></span>
      </div>
      <div class="control-item">
        <span>前进一帧</span>
        <span><span class="key">F</span> 或 <span class="key">→</span></span>
      </div>
      <div class="control-item">
        <span>暂停/播放</span>
        <span><span class="key">Space</span></span>
      </div>
      <div class="control-item">
        <span>截图当前帧</span>
        <span><span class="key">G</span></span>
      </div>
    </div>
  </div>

  <button class="toggle-btn" id="togglePanel">
    切换控制面板显示
  </button>

  <button class="toggle-btn secondary" id="resetPosition" style="margin-top: 8px;">
    重置面板位置
  </button>

  <div class="footer">
    在抖音视频页面使用 · 可拖拽面板
  </div>

  <script src="popup.js"></script>
</body>
</html>
